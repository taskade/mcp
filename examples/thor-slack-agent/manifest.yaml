display_information:
  name: Thor
  description: A god of thunder who turns your Slack threads into organized Taskade work.
  background_color: "#1a1d29"
features:
  bot_user:
    display_name: Thor
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:read
      - im:history
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
